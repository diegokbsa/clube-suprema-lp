<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-labelledby="t d">
  <title id="t">Ciclo das fichas no Clube Suprema</title>
  <desc id="d">Cinco etapas em sequência: PIX da conta no seu CPF, Fichas 24h valida e credita, saldo de fichas no app, jogo na mesa do clube e saque de volta para a chave PIX do seu CPF.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#040404"/><stop offset="1" stop-color="#1c1c1c"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#df9741" stop-opacity="0"/><stop offset=".5" stop-color="#efa144"/><stop offset="1" stop-color="#df9741" stop-opacity="0"/></linearGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#efa144"/></marker>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <text x="600" y="52" text-anchor="middle" font-family="Montserrat, Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="4" fill="#efa144">O CAMINHO DAS FICHAS</text>
  <rect x="140" y="70" width="920" height="2" fill="url(#gold)"/>

  <g font-family="Montserrat, Arial, sans-serif" text-anchor="middle">
    <!-- 1 PIX -->
    <rect x="40" y="150" width="200" height="200" rx="22" fill="#202023" stroke="#2f2f35"/>
    <circle cx="140" cy="200" r="24" fill="rgba(40,167,69,.18)" stroke="#28a745" stroke-opacity=".6"/>
    <text x="140" y="208" font-size="22" font-weight="800" fill="#4ade80">1</text>
    <text x="140" y="258" font-size="21" font-weight="800" fill="#fff">PIX</text>
    <text x="140" y="284" font-size="14" fill="#b9bbbe">da conta no</text>
    <text x="140" y="304" font-size="14" font-weight="700" fill="#efa144">seu CPF</text>
    <line x1="246" y1="250" x2="268" y2="250" stroke="#efa144" stroke-width="3" marker-end="url(#arr)"/>

    <!-- 2 Fichas 24h -->
    <rect x="276" y="150" width="200" height="200" rx="22" fill="#202023" stroke="#2f2f35"/>
    <circle cx="376" cy="200" r="24" fill="rgba(239,161,68,.14)" stroke="#efa144" stroke-opacity=".5"/>
    <text x="376" y="208" font-size="22" font-weight="800" fill="#efa144">2</text>
    <text x="376" y="258" font-size="21" font-weight="800" fill="#fff">Fichas 24h</text>
    <text x="376" y="284" font-size="14" fill="#b9bbbe">valida CPF e</text>
    <text x="376" y="304" font-size="14" fill="#b9bbbe">credita as fichas</text>
    <line x1="482" y1="250" x2="504" y2="250" stroke="#efa144" stroke-width="3" marker-end="url(#arr)"/>

    <!-- 3 Saldo -->
    <rect x="512" y="150" width="200" height="200" rx="22" fill="#202023" stroke="#efa144" stroke-opacity=".6"/>
    <circle cx="612" cy="200" r="24" fill="#efa144"/>
    <text x="612" y="208" font-size="22" font-weight="800" fill="#1c1c1c">3</text>
    <text x="612" y="258" font-size="21" font-weight="800" fill="#fff">Saldo no app</text>
    <text x="612" y="284" font-size="14" fill="#b9bbbe">clube 10001</text>
    <text x="612" y="304" font-size="14" fill="#b9bbbe">agente 1439098</text>
    <line x1="718" y1="250" x2="740" y2="250" stroke="#efa144" stroke-width="3" marker-end="url(#arr)"/>

    <!-- 4 Mesa -->
    <rect x="748" y="150" width="200" height="200" rx="22" fill="#202023" stroke="#2f2f35"/>
    <circle cx="848" cy="200" r="24" fill="rgba(239,161,68,.14)" stroke="#efa144" stroke-opacity=".5"/>
    <text x="848" y="208" font-size="22" font-weight="800" fill="#efa144">4</text>
    <text x="848" y="258" font-size="21" font-weight="800" fill="#fff">Mesa</text>
    <text x="848" y="284" font-size="14" fill="#b9bbbe">cash, torneio</text>
    <text x="848" y="304" font-size="14" fill="#b9bbbe">ou Spin</text>
    <line x1="954" y1="250" x2="976" y2="250" stroke="#efa144" stroke-width="3" marker-end="url(#arr)"/>

    <!-- 5 Saque -->
    <rect x="984" y="150" width="190" height="200" rx="22" fill="#202023" stroke="#2f2f35"/>
    <circle cx="1079" cy="200" r="24" fill="rgba(40,167,69,.18)" stroke="#28a745" stroke-opacity=".6"/>
    <text x="1079" y="208" font-size="22" font-weight="800" fill="#4ade80">5</text>
    <text x="1079" y="258" font-size="21" font-weight="800" fill="#fff">Saque</text>
    <text x="1079" y="284" font-size="14" fill="#b9bbbe">na chave PIX</text>
    <text x="1079" y="304" font-size="14" font-weight="700" fill="#efa144">do seu CPF</text>
  </g>

  <g font-family="Montserrat, Arial, sans-serif">
    <rect x="40" y="410" width="1134" height="150" rx="22" fill="#141416" stroke="#2f2f35"/>
    <text x="70" y="452" font-size="15" font-weight="700" letter-spacing="3" fill="#efa144">REGRAS QUE EVITAM ATRASO</text>
    <text x="70" y="488" font-size="18" fill="#e4e4e7">• Só PIX de conta no próprio CPF: pagamento de terceiros é devolvido.</text>
    <text x="70" y="516" font-size="18" fill="#e4e4e7">• Na primeira compra: ID da Suprema, clube 10001, agente 1439098, CPF, celular e nascimento.</text>
    <text x="70" y="544" font-size="18" fill="#e4e4e7">• Dúvida ou atraso: comprovante + ID da Suprema no WhatsApp do suporte 24h.</text>
  </g>
</svg>
